[project]
name = "agentproof"
version = "0.1.0"
description = "Evaluate AI agents by what they do: trajectories, outcomes and grounding, over repeated trials."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mayur Walke" }]
dependencies = []          # the core has no dependencies; adapters bring their own

[project.optional-dependencies]
openai-agents = ["openai-agents>=0.22", "openai>=1.0"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
